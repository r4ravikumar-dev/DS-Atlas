# Local/staging stack. NOTE: authored for portability; not executed in the original dev environment (no Docker there).
services:
  db:
    image: postgres:17
    environment: { POSTGRES_DB: dsrp, POSTGRES_USER: dsrp, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dsrp"], interval: 5s, retries: 10 }
  migrate:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python scripts/manage.py seed"]
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgresql+psycopg://dsrp:${POSTGRES_PASSWORD}@db:5432/dsrp" }
    depends_on: { db: { condition: service_healthy } }
  api:
    build: ./backend
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgresql+psycopg://dsrp:${POSTGRES_PASSWORD}@db:5432/dsrp", STORAGE_DIR: /app/storage }
    volumes: [storage:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: ./backend
    command: ["python", "-m", "app.workers.main"]
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgresql+psycopg://dsrp:${POSTGRES_PASSWORD}@db:5432/dsrp", STORAGE_DIR: /app/storage }
    volumes: [storage:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: ., dockerfile: Dockerfile.frontend }
    environment: { BACKEND_URL: "http://api:8000" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, storage: {} }
